<!doctype html>
<html lang="ar-om" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تذكير الموظفين — لوحة تحكم السندباد</title>
<link rel="stylesheet" href="ui.css?v=1124174253">
<link rel="stylesheet" href="forms.css?v=1124174253">
<style>
/* Everything an employee should be reminded of, in one place (Mohamed 2026-11-24: «شاشة تذكرات عليها كل الحاجات اللى
   المفروض اذكر بيها الموظفين»). One row per employee, because one reminder goes to each employee with all of it:
   documents not read, news not confirmed, trainings not answered or to be retaken, and what is missing from the
   profile. The other pages keep their own detail; this one only gathers and sends. */
.kinds{display:flex;gap:6px;flex-wrap:wrap}
.rd{display:grid;grid-template-columns:150px minmax(0,1fr);gap:6px 18px;font-size:var(--t-ui);align-items:baseline}
.rd dt{color:var(--m);font-size:var(--t-sm)}
.rd dd{margin:0}
.rd .bad{color:#B3261E}
#rows td.end{white-space:nowrap}
@media (max-width:760px){#rows td.end{white-space:normal;display:grid;grid-template-columns:1fr 1fr;gap:6px}#rows td.end .btn{width:100%}}
@media (max-width:760px){.rd{grid-template-columns:minmax(0,1fr)}}
</style>
</head>
<body>
<div class="app">
  <header id="top"></header>
  <div class="hello"><div><h1 class="d">تذكير الموظفين</h1><p>كل ما ينتظر الموظفين في مكان واحد: مستندات لم تُقرأ، أخبار لم يؤكَّد الاطلاع عليها، تدريبات لم تُنجز، وملفات شخصية ناقصة.</p></div></div>
  <div class="card stats" id="stats" style="margin-bottom:12px"></div>
  <section class="card">
    <div class="bar">
      <div class="seg" id="tabs" role="group" aria-label="نوع التذكير"></div>
      <span class="sp"></span>
      <label class="pick"><input type="checkbox" id="late"> المتأخر فقط</label>
      <input class="field" id="q" type="search" placeholder="ابحث باسم الموظف" aria-label="بحث">
      <label class="pick"><input type="checkbox" id="all"> تحديد الكل</label>
      <button class="btn k" id="send" disabled></button>
    </div>
    <div class="tb"><table><thead><tr><th></th><th>الموظف</th><th>ما ينتظره</th><th>آخر تذكير</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>
    <p class="note" id="count"></p>
  </section>
</div>
<script src="ui.js?v=1124174253"></script>
<script src="forms.js?v=1124174253"></script>
<script>
var KIND=[["docs","المستندات"],["news","الأخبار"],["tr","التدريب"],["prof","الملف الشخصي"]],tab="all",sel={},open={},SENT={};
function plural(n,one,two,many){return n===1?one:n===2?two:n+" "+many}
/* shortcut: gathered from the sample data of the other pages; in APEX this is one view over the real records */
function build(){
  var M={},order=[],active={};EMPS.forEach(function(e){if(e.st==="نشط")active[e.name]=e});
  function get(name,dept){if(!M[name]){M[name]={name:name,dept:dept||"",docs:0,late:0,news:[],tr:[],redo:[],prof:[]};order.push(name)}return M[name]}
  ACKS.forEach(function(a){if(a.all>a.done){var x=get(a.name,a.dept);x.docs=a.all-a.done;x.late=a.late;x.rem=a.rem}});
  NEWS.filter(function(n){return n.st!=="مسودة"&&n.ack}).forEach(function(n){var aud=audCalc(audState(n.aud)).see.map(function(r){return r.e});
    aud.slice(Math.min(seenOf(n),aud.length)).forEach(function(e){if(active[e.name])get(e.name,e.dept).news.push(n.t)})});
  TRAIN.filter(function(p){return p.st==="منشور"&&p.qs.length}).forEach(function(p){results(p).forEach(function(r){if(!active[r.e.name])return;
    if(r.sc==null)get(r.e.name,r.e.dept).tr.push({n:p.n,over:!!p.due&&p.due<TODAY,due:p.due});
    else if(r.ld===LEAD[2])get(r.e.name,r.e.dept).redo.push(p.n)})});
  EMPS.forEach(function(e){if(e.st==="نشط"&&prof(e).miss.length)get(e.name,e.dept).prof=prof(e).miss});
  return order.map(function(n){var x=M[n];x.over=x.late+x.tr.filter(function(t){return t.over}).length;x.total=x.docs+x.news.length+x.tr.length+x.redo.length+(x.prof.length?1:0);return x})
    .sort(function(a,b){return (b.over-a.over)||(b.total-a.total)});
}
function has(x,k){return k==="docs"?x.docs:k==="news"?x.news.length:k==="tr"?x.tr.length+x.redo.length:x.prof.length}
function remOf(x){return SENT[x.name]||x.rem||""}
function can(x){return !remOf(x)}
function vis(L){var q=$("q").value.trim(),lt=$("late").checked;return L.filter(function(x){return (tab==="all"||has(x,tab))&&(!lt||x.over)&&(!q||x.name.indexOf(q)>-1)})}
function send(names){names.forEach(function(n){SENT[n]="الآن";delete sel[n]});render();toast("تم إرسال تذكير واحد لكل موظف (‏"+names.length+"‏) يضم جميع ما ينتظره.")}
document.addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;
  if(b.dataset.tab){tab=b.dataset.tab;sel={};render()}
  if(b.dataset.one)send([b.dataset.one]);
  if(b.dataset.open){open[b.dataset.open]=!open[b.dataset.open];render()}
  if(b.id==="send")send(Object.keys(sel))});
document.addEventListener("input",function(e){var t=e.target;
  if(t.id==="q"||t.id==="late")render();
  if(t.id==="all"){sel={};if(t.checked)vis(build()).filter(can).forEach(function(x){sel[x.name]=1});render()}
  if(t.dataset.pick){if(t.checked)sel[t.dataset.pick]=1;else delete sel[t.dataset.pick];render()}});
function kinds(x){var o=[];
  if(x.docs)o.push('<span class="chip s">'+plural(x.docs,"مستند لم يُقرأ","مستندان لم يُقرآ","مستندات لم تُقرأ")+'</span>'+(x.late?'<span class="chip bad">'+plural(x.late,"متأخر","متأخران","متأخرة")+'</span>':''));
  if(x.news.length)o.push('<span class="chip s">'+plural(x.news.length,"خبر لم يؤكَّد","خبران لم يؤكَّدا","أخبار لم تؤكَّد")+'</span>');
  if(x.tr.length)o.push('<span class="chip s">'+plural(x.tr.length,"تدريب لم يُنجز","تدريبان لم يُنجزا","تدريبات لم تُنجز")+'</span>'+(x.tr.some(function(t){return t.over})?'<span class="chip bad">انتهى الموعد</span>':''));
  if(x.redo.length)o.push('<span class="chip">إعادة اختبار مطلوبة</span>');
  if(x.prof.length)o.push('<span class="chip s">ملف شخصي ينقصه '+plural(x.prof.length,"بند","بندان","بنود")+'</span>');
  return '<div class="kinds">'+o.join("")+'</div>'}
function detail(x){var r=[];
  if(x.docs)r.push(['مستندات لم يقرأها',x.docs+' من المطلوب'+(x.late?' · <span class="bad">'+x.late+' تجاوزت 14 يومًا</span>':'')+' · <a href="acks.html">التفاصيل في إقرارات القراءة</a>']);
  if(x.news.length)r.push(['أخبار لم يؤكِّد الاطلاع عليها',x.news.map(esc).join("، ")]);
  if(x.tr.length)r.push(['تدريبات لم يُجب عن أسئلتها',x.tr.map(function(t){return esc(t.n)+(t.due?' <span class="'+(t.over?'bad':'m')+'">('+(t.over?'انتهى موعده ':'آخر موعد ')+ltr(t.due)+')</span>':'')}).join("، ")]);
  if(x.redo.length)r.push(['طُلبت منه إعادة الاختبار',x.redo.map(esc).join("، ")]);
  if(x.prof.length)r.push(['ينقص ملفه الشخصي',x.prof.map(esc).join("، ")]);
  return '<dl class="rd">'+r.map(function(k){return '<dt>'+k[0]+'</dt><dd>'+k[1]+'</dd>'}).join("")+'</dl>'}
function render(){
  var L=build(),n=function(k){return L.filter(function(x){return has(x,k)}).length},over=L.filter(function(x){return x.over}).length;
  $("stats").innerHTML=[["acc","users","موظفون ينتظرهم شيء",L.length,"لكل واحد منهم تذكير واحد يضم كل ما ينتظره"],
    [over?"bad":"","clock","لديهم متأخرات",over,"مستند تجاوز 14 يومًا أو تدريب انتهى موعده"],
    ["","cap","تدريبات لم تُنجز",L.reduce(function(a,x){return a+x.tr.length+x.redo.length},0),"لدى "+n("tr")+" موظفين"],
    ["","doc","ملفات شخصية ناقصة",n("prof"),"موظفون ينقص ملفهم بنود"]].map(function(k){
    return '<div class="tile '+k[0]+'"><header><span>'+k[2]+'</span><span class="ico">'+ic(k[1],18)+'</span></header><div class="big">'+k[3]+'</div><footer>'+k[4]+'</footer></div>'}).join("");
  $("tabs").innerHTML='<button data-tab="all" aria-pressed="'+(tab==="all")+'">الكل<b>'+L.length+'</b></button>'+KIND.map(function(k){return '<button data-tab="'+k[0]+'" aria-pressed="'+(tab===k[0])+'">'+k[1]+'<b>'+n(k[0])+'</b></button>'}).join("");
  var list=vis(L),ns=Object.keys(sel).length,cn=list.filter(can).length;
  $("all").checked=cn>0&&ns===cn;$("all").disabled=!cn;
  $("send").disabled=!ns;$("send").textContent=ns?"إرسال تذكير للمحددين ("+ns+")":"إرسال تذكير للمحددين";
  $("rows").innerHTML=list.length?list.map(function(x){var rm=remOf(x),nm=esc(x.name);
    return '<tr><td><label class="ck"><input type="checkbox" data-pick="'+nm+'" aria-label="تحديد '+nm+'"'+(sel[x.name]?' checked':'')+(can(x)?'':' disabled')+'></label></td>'+
      '<td><div class="who">'+av(x.name)+'<div><b>'+nm+'</b><small>'+esc(x.dept)+'</small></div></div></td>'+
      '<td class="full">'+kinds(x)+'</td><td class="hide m">'+(rm||'—')+'</td>'+
      '<td class="end full"><button class="btn sm" data-open="'+nm+'" aria-expanded="'+!!open[x.name]+'">'+(open[x.name]?'إخفاء التفاصيل':'التفاصيل')+'</button> '+(rm?'<button class="btn sm" disabled>أُرسل '+esc(rm)+'</button>':'<button class="btn sm" data-one="'+nm+'">إرسال تذكير</button>')+'</td></tr>'+
      (open[x.name]?'<tr class="det"><td colspan="5" class="full">'+detail(x)+'</td></tr>':'')}).join(""):
    '<tr><td colspan="5" class="empty">'+(L.length?'لا يوجد موظفون بهذه الشروط. جرّب تغيير النوع أو البحث.':'لا يوجد ما يُذكَّر به أحد الآن.')+'</td></tr>';
  $("count").textContent=list.length+" من "+L.length+" موظفين · يستلم كل موظف رسالة واتساب واحدة تضم جميع ما ينتظره · «تحديد الكل» يحدّد الظاهرين الذين لم يُرسل لهم بعد · بيانات تجريبية";
}
</script>
</body>
</html>
