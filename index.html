<!doctype html>
<html lang="ar-om" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>نظرة عامة — لوحة تحكم السندباد</title>
<link rel="stylesheet" href="ui.css?v=1125100643">
<link rel="stylesheet" href="forms.css?v=1125100643">
<style>
/* UI review 2026-11-23: every figure appears once. Row 1 = what waits and how big things are, row 2 = reading health
   (one headline, one bar) beside the per-department picture, row 3 = the work lists. */
a.tile{color:inherit;text-decoration:none}
a.tile:hover{outline:2px solid var(--line)}
a.tile.acc:hover{outline-color:transparent;filter:brightness(1.04)}
.hero{grid-column:span 4;display:flex;flex-direction:column;gap:14px}
.hero .lead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.hero .pct{font-family:"Alexandria",sans-serif;font-size:calc(var(--t-h1) + 12px);font-weight:600;line-height:1.1}
.hero .lead > span{color:var(--m)}
.hero .lead > .pct{color:var(--ink)}
.hero .lead b{color:var(--ink);font-weight:600}
/* one bar, three parts: read, still inside the deadline, late */
.split{display:flex;gap:3px;height:14px}
.split i{display:block;border-radius:99px;min-width:6px}
.legend{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.legend div{display:grid;gap:2px}
.legend span{font-size:var(--t-sm);color:var(--m);display:flex;align-items:center;gap:6px}
.legend span i{width:8px;height:8px;border-radius:50%;flex:none}
.legend b{font-family:"Alexandria",sans-serif;font-size:var(--t-h2);font-weight:600;line-height:1.3}
.hero .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
/* GPT review 2026-11-24: what waits for a decision sits first, as short rows; every row carries its own button */
.wait{margin-bottom:12px}
.wait h2 small{font-family:"IBM Plex Sans Arabic",sans-serif;font-weight:400;color:var(--m)}
.dq{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.dq:empty{display:none}
.dr:last-child:nth-child(odd){grid-column:1/-1}
.dr{display:flex;align-items:center;gap:12px;background:var(--sub);border-radius:16px;padding:8px 12px;min-width:0}
.dr > .av,.dr > em{flex:none}
.dr > em{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--soft);color:var(--on-soft);font-style:normal}
.dr > div{flex:1;min-width:0;line-height:1.5}
.dr b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dr small{display:block;color:var(--m);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dr .acts{display:flex;gap:6px;flex:none}
.wait #nil:empty{display:none}
.wait #nil{margin-top:12px}
/* reading per department: the same three colours as the bar beside it (read, inside the deadline, late) */
.mb{display:flex;gap:2px;height:8px;min-width:120px;margin-top:5px}
.mb i{display:block;border-radius:99px;min-width:4px}
.c-read{background:#9AAE00}.c-in{background:var(--sea)}.c-late{background:var(--late)}
td.lt b{font-family:"Alexandria",sans-serif;font-weight:600}
td.lt span{color:var(--m)}
.table{grid-column:span 8;display:flex;flex-direction:column}
.table .tb{flex:1}
.table table{height:100%}
.table h2{margin-bottom:12px}
@media (max-width:1100px){.hero,.table{grid-column:1/-1}.dq{grid-template-columns:1fr}}
@media (max-width:760px){.stats{grid-template-columns:1fr 1fr}.dr{flex-wrap:wrap}.dr .acts{width:100%}.dr .acts .btn{flex:1}}
</style>
</head>
<body>
<div class="app">
  <header id="top"></header>
  <div class="hello"><div><h1 class="d">صباح الخير، محمد</h1><p>ما ينتظر قرارك، وحال إقرارات القراءة اليوم.</p></div><p>الأحد 22 نوفمبر 2026</p></div>
  <section class="card wait"><h2><span>ينتظر قرارك <small id="waitN"></small></span></h2><div class="dq" id="dq"></div><div id="nil"></div></section>
  <div class="card stats" id="tiles" style="margin-bottom:12px"></div>
  <div class="grid">
    <section class="card hero">
      <h2>إقرارات القراءة</h2>
      <div class="lead"><span class="pct n" id="pct"></span><span>قُرئ <b id="readN"></b> إقرارًا من أصل <b id="allN"></b></span></div>
      <div class="split" id="split" role="img"></div>
      <div class="legend" id="legend"></div>
      <div class="acts" id="ackActs"></div>
    </section>
    <section class="card table">
      <h2>القراءة في كل قسم <span id="allBtn"></span></h2>
      <div class="tb"><table><thead><tr><th>القسم</th><th>قرأ من الإجمالي</th><th>متأخر</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>
    </section>
  </div>
  <p class="note">نموذج تصميم: الأرقام والأسماء للعرض فقط.</p>
</div>
<script src="ui.js?v=1125100643"></script>
<script src="forms.js?v=1125100643"></script>
<script>
document.addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;
  if(b.dataset.remind==="all"){var n=totals().people;D.depts.forEach(function(d){if(d.pend)d.sent=true});render();toast("تم إرسال تذكير لـ "+n+" موظف.")}
  else if(b.dataset.remind){var d=D.depts[b.dataset.remind];d.sent=true;render();toast("تم إرسال تذكير لـ "+d.people+" موظفين في "+d.name+".")}
  if(b.dataset.approve){var a=D.reqs.splice(b.dataset.approve,1)[0];render();shell();toast("تم اعتماد حساب "+a.name+".")}
  if(b.dataset.reject){var r=D.reqs.splice(b.dataset.reject,1)[0];render();shell();toast("تم رفض طلب "+r.name+".")}
});
function render(){
  var t=totals(),n=D.reqs.length,hr=hrQueue(),inTime=t.pend-t.late,act=EMPS.filter(function(e){return e.st==="نشط"});
  /* the newer pages, one line each (Mohamed 2026-11-24: link the overview to them): what is open there right now */
  var live=TRAIN.filter(function(p){return p.st==="منشور"&&p.qs.length}),R=[];live.forEach(function(p){R=R.concat(results(p))});
  var ans=R.filter(function(r){return r.sc!=null}).length,waitM=R.filter(function(r){return r.ld===LEAD[1]}).length,
      remNames={},remN=0,
      newC=COMPL.filter(function(c){return c.st==="جديدة"}).length,books=DOCS.filter(function(d){return d.st==="بانتظار المراجعة"}).length;
  var actN={};act.forEach(function(e){actN[e.name]=1;if(prof(e).miss.length)remNames[e.name]=1});
  ACKS.forEach(function(a){if(a.all>a.done)remNames[a.name]=1});
  NEWS.filter(function(x){return x.st!=="مسودة"&&x.ack}).forEach(function(x){var au=audCalc(audState(x.aud)).see.map(function(r){return r.e});au.slice(Math.min(seenOf(x),au.length)).forEach(function(e){if(actN[e.name])remNames[e.name]=1})});
  R.forEach(function(r){if(actN[r.e.name]&&(r.sc==null||r.ld===LEAD[2]))remNames[r.e.name]=1});
  remN=Object.keys(remNames).length;
  var profP=pc(act.reduce(function(a,e){return a+prof(e).done},0),act.reduce(function(a,e){return a+prof(e).all},0)),full=act.filter(function(e){return !prof(e).miss.length}).length;
  /* follow-up only: whatever needs a decision is in the rows above, so no figure appears twice */
  $("tiles").innerHTML=[
    ["bad","clock","إقرارات متأخرة",t.late,"تجاوزت 14 يومًا","acks.html"],
    ["","users","متوسط اكتمال الملفات الشخصية",profP+"%",(full===1?"ملف واحد مكتمل":full===2?"ملفان مكتملان":full+" ملفات مكتملة")+" من أصل "+act.length,"employees.html"],
    ["","cap","التدريب",live.length?pc(ans,R.length)+"%":"—",live.length?"أجاب "+ans+" من "+R.length+(waitM?" · "+waitM+" بانتظار المدير المباشر":""):"لا تدريب منشور","training.html"],
    ["","clock","تذكير الموظفين",remN,"موظفون ينتظرهم تذكير","reminders.html"]
  ].map(function(k){return '<a class="tile '+k[0]+'" href="'+k[5]+'"><header><span>'+k[2]+'</span><span class="ico">'+ic(k[1],18)+'</span></header><div class="big">'+k[3]+'</div><footer>'+k[4]+'</footer></a>'}).join("");
  $("pct").textContent=t.pct+"%";$("readN").textContent=t.read;$("allN").textContent=t.all;
  var parts=[["#9AAE00","قرأ وأقرّ",t.read],["var(--sea)","ضمن المهلة",inTime],["var(--late)","متأخر",t.late]];/* same colours as .c-read .c-in .c-late */
  $("split").innerHTML=parts.map(function(x){return x[2]?'<i style="flex:'+x[2]+';background:'+x[0]+'"></i>':''}).join("");
  $("split").setAttribute("aria-label",parts.map(function(x){return x[1]+" "+x[2]}).join("، "));
  $("legend").innerHTML=parts.map(function(x){return '<div><b class="n">'+x[2]+'</b><span><i style="background:'+x[0]+'"></i>'+x[1]+'</span></div>'}).join("");
  $("ackActs").innerHTML=(t.people?'<button class="btn k" data-remind="all">إرسال تذكير للكل</button>':'<button class="btn k" disabled>أُرسل التذكير</button>')+'<a class="btn" href="acks.html">كل الإقرارات</a>';
  var when={};REG.forEach(function(x){when[x[0]]=x[3]});
  var adv=REQS.filter(function(r){return r.type==="سلفة"&&r.st==="قيد الإجراء"&&r.lead&&r.lead.ok&&!r.hr});
  var rows=D.reqs.map(function(r,i){
    return '<div class="dr">'+av(r.name)+'<div><b>'+esc(r.name)+'</b><small>تسجيل جديد · '+esc(r.meta)+(when[r.name]?' · '+ltr(when[r.name]):'')+'</small></div><div class="acts"><button class="btn sm k" data-approve="'+i+'">اعتماد الحساب</button><button class="btn sm" data-reject="'+i+'">رفض</button></div></div>'})
  .concat(adv.map(function(r){
    return '<div class="dr">'+av(r.name)+'<div><b>'+esc(r.name)+'</b><small>سلفة وافق عليها المدير المباشر · <span class="n">'+r.d.amount+'</span> ر.ع على <span class="n">'+r.d.months+'</span> أقساط</small></div><div class="acts"><a class="btn sm k" href="requests.html">مراجعة السلفة</a></div></div>'}));
  if(books)rows.push('<div class="dr"><em>'+ic("folder",18)+'</em><div><b>'+(books===1?"كتاب واحد بانتظار المراجعة":books===2?"كتابان بانتظار المراجعة":books+" كتب بانتظار المراجعة")+'</b><small>رفعها الموظفون من البوابة</small></div><div class="acts"><a class="btn sm k" href="library.html">مراجعة الكتب</a></div></div>');
  if(newC)rows.push('<div class="dr"><em>'+ic("mail",18)+'</em><div><b>'+(newC===1?"رسالة جديدة":newC===2?"رسالتان جديدتان":newC+" رسائل جديدة")+'</b><small>شكاوى ومقترحات تنتظر المراجعة والرد</small></div><div class="acts"><a class="btn sm k" href="complaints.html">مراجعة الرسائل</a></div></div>');
  var total=n+adv.length+books+newC;
  $("waitN").textContent=total?"· "+total:"";
  $("dq").innerHTML=rows.join("");
  $("nil").innerHTML=rows.length?"":nil("لا شيء ينتظر قرارك الآن","تظهر هنا التسجيلات الجديدة، والسلف التي وافق عليها المدير المباشر، والكتب والرسائل الجديدة.");
  $("allBtn").innerHTML=t.people?'<button class="btn sm" data-remind="all">إرسال تذكير للكل ('+t.people+' موظف)</button>':'';
  /* most late first: the department that needs the reminder is on top */
  $("rows").innerHTML=D.depts.map(function(d,i){return [d,i]}).sort(function(a,b){return b[0].late-a[0].late||b[0].pend-a[0].pend}).map(function(x){var d=x[0],i=x[1],all=d.read+d.pend,inT=d.pend-d.late;
    return '<tr><td><b>'+esc(d.name)+'</b><small>'+esc(d.lead)+'</small></td>'+
      '<td class="full"><span class="n">'+d.read+'</span> من <span class="n">'+all+'</span><div class="mb" role="img" aria-label="قرأ '+d.read+'، ضمن المهلة '+inT+'، متأخر '+d.late+'">'+(d.read?'<i class="c-read" style="flex:'+d.read+'"></i>':'')+(inT?'<i class="c-in" style="flex:'+inT+'"></i>':'')+(d.late?'<i class="c-late" style="flex:'+d.late+'"></i>':'')+'</div></td>'+
      '<td class="lt">'+(d.late?'<b class="n">'+d.late+'</b>':all===d.read?'<span class="st done">مكتمل</span>':'<span>لا يوجد</span>')+'</td>'+
      '<td class="end full">'+(d.pend?(d.sent?'<button class="btn sm" disabled>أُرسل التذكير</button>':'<button class="btn sm" data-remind="'+i+'">إرسال تذكير</button>'):'')+'</td></tr>'}).join("");
}
</script>
</body>
</html>
