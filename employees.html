<!doctype html>
<html lang="ar-om" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الموظفون — لوحة تحكم السندباد</title>
<link rel="stylesheet" href="ui.css?v=1125161253">
<link rel="stylesheet" href="forms.css?v=1125161253">
</head>
<body>
<div class="app">
  <header id="top"></header>
  <div class="hello"><div><h1 class="d">الموظفون</h1><p>فعّل التسجيلات الجديدة وعدّل البيانات والصلاحيات.</p></div><button class="btn" id="csv">تصدير</button></div>
  <div class="card stats" id="stats" style="margin-bottom:16px"></div>
  <section class="card">
    <div class="bar">
      <div class="seg" id="tabs" role="group" aria-label="الحالة"></div>
      <span class="sp"></span>
      <select class="field" id="dept" aria-label="القسم"></select>
      <label class="pick"><input type="checkbox" id="inc"> ملفات ناقصة فقط</label>
      <input class="field" id="q" type="search" placeholder="ابحث بالاسم أو البريد" aria-label="بحث">
    </div>
    <div class="tb"><table><thead><tr><th>الموظف</th><th>القسم</th><th>الفرع</th><th>الصلاحية</th><th>اكتمال الملف</th><th>الحالة</th><th>آخر دخول</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>
    <p class="note" id="count"></p>
  </section>
</div>
<script src="ui.js?v=1125161253"></script>
<script src="forms.js?v=1125161253"></script>
<script>
var shown=[];
/* no "بدون حساب" state (Mohamed 2026-11-23: not workable): an employee either has an account or is deleted from the list */
var TABS=["الكل","نشط","بانتظار التفعيل","موقوف","مرفوض"],tab="الكل",CLS={"نشط":"done","موقوف":"late","مرفوض":"late"};
function cnt(s){return EMPS.filter(function(e){return s==="الكل"||e.st===s}).length}
document.addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;
  if(b.dataset.tab){tab=b.dataset.tab;render()}
  if(b.dataset.purge){var pe=EMPS[b.dataset.purge];confirmDel("الموظف",pe.name,"سيُحذف هو وبياناته من قائمة الموظفين.",function(){EMPS.splice(EMPS.indexOf(pe),1)})}
  /* same file as the live button: the rows on screen, UTF-8 with BOM, cells starting with = + @ - are neutralised */
  if(b.id==="csv"){var csv=[["الموظف","البريد","القسم","الحالة"]].concat(shown.map(function(u){return [u.name,u.mail,u.dept,u.st]})).map(function(r){return r.map(function(v){v=String(v==null?"":v);return '"'+(/^[=+@\-\t\r]/.test(v)?"'":"")+v.replace(/"/g,'""')+'"'}).join(",")}).join("\r\n");
    var a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8"}));a.download="employees.csv";a.click();setTimeout(function(){URL.revokeObjectURL(a.href)},1000);toast("تم تصدير "+shown.length+" موظف إلى employees.csv.")}
  if(b.dataset.ok){var x=EMPS[b.dataset.ok];x.st="نشط";D.reqs.pop();shell();render();toast("تم اعتماد حساب "+x.name+".")}
  if(b.dataset.no){var y=EMPS.splice(b.dataset.no,1)[0];D.reqs.pop();shell();render();toast("تم رفض طلب "+y.name+".")}
});
document.addEventListener("input",function(e){if(e.target.id==="q"||e.target.id==="dept"||e.target.id==="inc")render()});
function render(){
  if(!$("dept").options.length){var ds=EMPS.map(function(e){return e.dept}).filter(function(d,i,a){return a.indexOf(d)===i});
    $("dept").innerHTML='<option value="">كل الأقسام</option>'+ds.map(function(d){return '<option>'+esc(d)+'</option>'}).join("")}
  $("stats").innerHTML=[["","users","اكتمال الملفات الشخصية",pc(EMPS.reduce(function(a,e){return a+prof(e).done},0),EMPS.reduce(function(a,e){return a+prof(e).all},0))+"%",EMPS.filter(function(e){return !prof(e).miss.length}).length+" من "+EMPS.length+" ملفهم مكتمل"],["","check","نشط",cnt("نشط"),"يستطيعون الدخول إلى البوابة"],["acc","clock","بانتظار التفعيل",cnt("بانتظار التفعيل"),"بانتظار اعتمادك"],["bad","clock","موقوف",cnt("موقوف"),"حسابات مقفلة مؤقتًا"]].map(function(k){
    return '<div class="tile '+k[0]+'"><header><span>'+k[2]+'</span><span class="ico">'+ic(k[1],18)+'</span></header><div class="big">'+k[3]+'</div><footer>'+k[4]+'</footer></div>'}).join("");
  $("tabs").innerHTML=TABS.map(function(s){return '<button data-tab="'+s+'" aria-pressed="'+(s===tab)+'">'+s+'<b>'+cnt(s)+'</b></button>'}).join("");
  var q=$("q").value.trim(),dp=$("dept").value;
  var list=EMPS.map(function(e,i){e.i=i;return e}).filter(function(e){
    return (tab==="الكل"||e.st===tab)&&(!dp||e.dept===dp)&&(!$("inc").checked||prof(e).miss.length)&&(!q||(e.name+e.mail).indexOf(q)>-1)});
  shown=list;
  $("rows").innerHTML=list.length?list.map(function(e){
    var view='<button class="btn sm" data-form="emp" data-i="'+e.i+'">عرض</button>';
    var act=e.st==="بانتظار التفعيل"?'<button class="btn sm k" data-ok="'+e.i+'">اعتماد</button> '+view:
      view;
    return '<tr><td class="full"><div class="who">'+av(e.name)+'<div><b>'+esc(e.name)+'</b><small>'+ltr(e.mail)+'</small></div></div></td>'+
      '<td>'+esc(e.dept)+'<small>'+esc(e.job)+'</small></td><td class="hide">'+esc(e.branch)+'</td>'+
      '<td class="hide">'+(e.role==="—"?'<span class="m">بدون دور</span>':'<span class="chip '+(e.role==="مدير النظام"?'k':'s')+'">'+esc(e.role)+'</span>')+(e.lead?' <span class="chip">مدير مباشر</span>':'')+'</td>'+
      '<td class="full">'+prog(prof(e).done,prof(e).all,"بنود مكتملة")+'</td><td><span class="st '+(CLS[e.st]||'')+'">'+esc(e.st)+'</span></td><td class="hide m">'+ltr(e.last)+'</td><td class="end full">'+act+'</td></tr>'}).join(""):
    '<tr><td colspan="8" class="empty">لا يوجد موظفون بهذه الشروط. جرّب تغيير البحث أو الحالة.</td></tr>';
  $("count").textContent=list.length+" من "+EMPS.length+" موظف · النطاق @sindbad.om · بيانات تجريبية";
}
</script>
</body>
</html>
